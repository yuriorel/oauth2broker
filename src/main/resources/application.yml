server:
  port: 8443
  ssl:
    bundle: broker

spring:
  application:
    name: oauth2broker
  threads:
    virtual:
      enabled: true
  ssl:
    bundle:
      jks:
        broker:
          key:
            alias: tls
          keystore:
            location: file:keystore.p12
            password: ${KEYSTORE_PASSWORD:changeit}
            type: PKCS12
  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

broker:
  issuer: https://localhost:8443
  keystore:
    location: file:keystore.p12
    password: ${KEYSTORE_PASSWORD:changeit}
    signing-alias: signing
  ttl:
    authorization-request: 10m
    authorization-code: 60s
    access-token: 15m
    refresh-token: 30d

# DEBUG writes every request and response body and each processing step to the file, unmasked (passwords,
# secrets, tokens). The console never shows DEBUG lines. One run: --logging.level.com.oauth2broker=DEBUG
logging:
  level:
    com.oauth2broker: DEBUG
  file:
    name: logs/oauth2broker.log
  threshold:
    console: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
